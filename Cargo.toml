[package]
name = "sing"
version = "0.5.0"
edition = "2021"
description = "A terminal client for sing-box on macOS and Linux"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "stream"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
libc = "0.2"
fs2 = "0.4"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
